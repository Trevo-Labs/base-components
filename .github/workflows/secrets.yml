name: secrets

on: [push, pull_request]

permissions:
  contents: read

# El binario de gitleaks y no `gitleaks/gitleaks-action`: la acción pide una
# licencia de pago cuando el repo es de una organización (Trevo-Labs lo es) y
# falla sin mirar nada. El binario es MIT y hace el mismo escaneo.
env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

      - name: Buscar secretos en todo el historial
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
