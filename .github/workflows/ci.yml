name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: |
          npm run typecheck --if-present
          npm run type-check --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: No hay secretos en el bundle
        run: |
          if grep -rEq 're_[A-Za-z0-9_]{16,}|sk_live_[A-Za-z0-9]{16,}|service_role' dist/ 2>/dev/null; then
            echo "::error::Hay algo con pinta de secreto en dist/"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 5
